name: Qualification receiving snapshots (no model)
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Owned receiving preflight path
        default: docs/releases/0.6.9-compact-receiving-preflight.json
        required: true
  push:
    branches: [codex/release-0.6.9]
    paths:
      - .github/workflows/qualification-receiving-069.yml
      - benchmarks/qualification_receiving.py
      - docs/releases/0.6.9-receiving-preflight.json
      - docs/releases/0.6.9-resumed-receiving-preflight.json
      - docs/releases/0.6.9-compact-receiving-preflight.json
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - name: Provision the owned receiving acquisition volume
        id: volume
        run: uv run python scripts/acquisition_volume.py prepare 2147483648
      - name: Acquire current receiving pins without running receiving programs
        env:
          GH_TOKEN: ${{ github.token }}
          CRAB_RECEIVING_PLAN: ${{ inputs.plan || 'docs/releases/0.6.9-compact-receiving-preflight.json' }}
        run: >-
          uv run python benchmarks/qualification_receiving.py
          --plan "$CRAB_RECEIVING_PLAN"
          --integration-head "${{ github.sha }}"
          --volume "${{ steps.volume.outputs.volume }}"
          --output "$RUNNER_TEMP/qualification-receiving"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualification-receiving
          path: ${{ runner.temp }}/qualification-receiving
          include-hidden-files: true
          retention-days: 14
      - name: Detach only the owned volume
        if: always() && steps.volume.outputs.root != ''
        env:
          CRAB_QUOTA_ROOT: ${{ steps.volume.outputs.root }}
        run: uv run python scripts/acquisition_volume.py cleanup "$CRAB_QUOTA_ROOT"
