name: Qualification acquisition (no model)

on:
  workflow_dispatch:
  push:
    branches: [codex/release-0.6.9]
    paths:
      - .github/workflows/qualification-acquire-069.yml
      - benchmarks/qualification_acquire.py
      - docs/releases/0.6.9-qualification-preflight.json

permissions:
  contents: read

concurrency:
  group: qualification-acquire-069-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    name: Shared facts (${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [crab, devostasis, beautifulrepo]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - name: Prepare exact trusted baseline source
        run: git worktree add --detach "$RUNNER_TEMP/crab-baseline" 915779769747908a14b1a0f7fdecdd79d16dce43
      - name: Provision a fixed 2 GiB acquisition volume
        id: volume
        run: uv run python scripts/acquisition_volume.py prepare 2147483648
      - name: Acquire shared facts without executing donor content or models
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python benchmarks/qualification_acquire.py
          --plan docs/releases/0.6.9-qualification-preflight.json
          --batch "${{ matrix.batch }}"
          --volume "${{ steps.volume.outputs.volume }}"
          --baseline "$RUNNER_TEMP/crab-baseline"
          --candidate "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/qualification-${{ matrix.batch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualification-facts-${{ matrix.batch }}
          path: ${{ runner.temp }}/qualification-${{ matrix.batch }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Detach and remove only the owned acquisition volume
        if: always() && steps.volume.outputs.root != ''
        env:
          CRAB_QUOTA_ROOT: ${{ steps.volume.outputs.root }}
        run: uv run python scripts/acquisition_volume.py cleanup "$CRAB_QUOTA_ROOT"
