name: CI completion metadata snapshot

# Runs on default-branch code, independently of the CI runner that may crash.
# Never check out or execute code from an untrusted pull request.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read

jobs:
  snapshot:
    name: Snapshot completed CI run metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture exact source attempt and job status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          attempt = os.environ["SOURCE_ATTEMPT"]
          token = os.environ["GH_TOKEN"]
          if not re.fullmatch(r"[1-9][0-9]*", run_id) or not re.fullmatch(r"[1-9][0-9]*", attempt):
              raise SystemExit("Invalid provider-owned numeric run or attempt identity")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit("Invalid provider-owned repository identity")

          failures = []
          collection_started_at = time.monotonic()
          collection_budget_seconds = 180  # Reserve at least two minutes for artifact upload.
          collection_deadline = collection_started_at + collection_budget_seconds
          base = "https://api.github.com/repos/" + repo

          def get(path):
              remaining = collection_deadline - time.monotonic()
              if remaining <= 0:
                  failures.append({"path": path, "error": "COLLECTION_DEADLINE_EXCEEDED"})
                  return {}
              request = Request(
                  base + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "HungryCrab-ci-metadata-snapshot",
                  },
              )
              try:
                  with urlopen(request, timeout=min(20, remaining)) as response:
                      payload = json.load(response)
                  if not isinstance(payload, dict):
                      failures.append({
                          "path": path,
                          "error": "NON_OBJECT_JSON_RESPONSE",
                          "type": type(payload).__name__,
                      })
                      return {}
                  return payload
              except (HTTPError, URLError, TimeoutError, ValueError) as error:
                  failures.append({"path": path, "error": type(error).__name__,
                                   "code": getattr(error, "code", None)})
                  return {}

          source = get(f"/actions/runs/{run_id}/attempts/{attempt}")
          if (
              source.get("id") != int(run_id)
              or source.get("run_attempt") != int(attempt)
              or source.get("status") != "completed"
          ):
              failures.append({
                  "error": "SOURCE_ATTEMPT_IDENTITY_MISMATCH",
                  "expected_run_id": int(run_id),
                  "observed_run_id": source.get("id"),
                  "expected_attempt": int(attempt),
                  "observed_attempt": source.get("run_attempt"),
                  "observed_status": source.get("status"),
              })
          jobs = []
          job_total = None
          seen_job_ids = set()
          for page in range(1, 21):
              payload = get(f"/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100&page={page}")
              page_jobs = payload.get("jobs")
              total_count = payload.get("total_count")
              if (
                  not isinstance(total_count, int)
                  or isinstance(total_count, bool)
                  or total_count < 0
                  or not isinstance(page_jobs, list)
              ):
                  failures.append({"error": "INVALID_JOBS_PAGE", "page": page})
                  break
              if job_total is None:
                  job_total = total_count
              elif job_total != total_count:
                  failures.append({
                      "error": "JOB_TOTAL_CHANGED", "page": page,
                      "expected": job_total, "observed": total_count,
                  })
                  break
              for job in page_jobs:
                  if not isinstance(job, dict):
                      failures.append({"error": "INVALID_JOB_ITEM", "page": page})
                      continue
                  job_id = job.get("id")
                  if (
                      not isinstance(job_id, int)
                      or isinstance(job_id, bool)
                      or job_id <= 0
                      or job_id in seen_job_ids
                  ):
                      failures.append({"error": "INVALID_OR_DUPLICATE_JOB_ID", "page": page})
                      continue
                  seen_job_ids.add(job_id)
                  steps = job.get("steps") or []
                  if not isinstance(steps, list) or any(not isinstance(step, dict) for step in steps):
                      failures.append({"error": "INVALID_JOB_STEPS", "page": page, "id": job_id})
                      steps = []
                  jobs.append({
                      "id": job_id,
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "started_at": job.get("started_at"),
                      "completed_at": job.get("completed_at"),
                      "steps": [
                          {
                              "number": step.get("number"), "name": step.get("name"),
                              "status": step.get("status"), "conclusion": step.get("conclusion"),
                          }
                          for step in steps
                      ],
                  })
              if len(jobs) >= job_total:
                  break
              if len(page_jobs) < 100:
                  failures.append({"error": "TRUNCATED_JOB_PAGE", "page": page})
                  break
              if page == 20:
                  failures.append({"error": "JOB_PAGE_LIMIT_REACHED", "cap": 2000})
          if job_total is None or len(jobs) != job_total:
              failures.append({
                  "error": "JOB_COUNT_MISMATCH",
                  "expected": job_total, "received": len(jobs),
              })
          artifacts = []
          artifact_total = None
          seen_artifact_ids = set()
          for page in range(1, 21):
              payload = get(f"/actions/runs/{run_id}/artifacts?per_page=100&page={page}")
              page_artifacts = payload.get("artifacts")
              total_count = payload.get("total_count")
              if (not isinstance(total_count, int) or isinstance(total_count, bool)
                      or total_count < 0 or not isinstance(page_artifacts, list)):
                  failures.append({"error": "INVALID_ARTIFACT_PAGE", "page": page})
                  break
              if artifact_total is None:
                  artifact_total = total_count
              elif artifact_total != total_count:
                  failures.append({"error": "ARTIFACT_TOTAL_CHANGED", "page": page,
                                   "expected": artifact_total, "observed": total_count})
                  break
              for item in page_artifacts:
                  if not isinstance(item, dict):
                      failures.append({"error": "INVALID_ARTIFACT_ITEM", "page": page})
                      continue
                  artifact_id = item.get("id")
                  if not isinstance(artifact_id, int) or artifact_id in seen_artifact_ids:
                      failures.append({"error": "INVALID_OR_DUPLICATE_ARTIFACT_ID", "page": page})
                      continue
                  seen_artifact_ids.add(artifact_id)
                  artifacts.append({
                      "id": artifact_id, "name": item.get("name"),
                      "size_in_bytes": item.get("size_in_bytes"), "expired": item.get("expired"),
                  })
              if len(artifacts) >= artifact_total:
                  break
              if len(page_artifacts) < 100:
                  failures.append({"error": "TRUNCATED_ARTIFACT_PAGE", "page": page})
                  break
              if page == 20:
                  failures.append({"error": "ARTIFACT_PAGE_LIMIT_REACHED", "cap": 2000})
          if artifact_total is None or len(artifacts) != artifact_total:
              failures.append({"error": "ARTIFACT_COUNT_MISMATCH",
                               "expected": artifact_total, "received": len(artifacts)})

          snapshot = {
              "schema": "hungrycrab-ci-completion-metadata/1",
              "source_repository": repo,
              "source_run_id": int(run_id),
              "source_attempt": int(attempt),
              "source_workflow_name": source.get("name"),
              "source_head_sha": source.get("head_sha"),
              "source_status": source.get("status"),
              "source_conclusion": source.get("conclusion"),
              "source_updated_at": source.get("updated_at"),
              "collection_budget_seconds": collection_budget_seconds,
              "collection_elapsed_seconds": round(time.monotonic() - collection_started_at, 3),
              "jobs": jobs,
              "run_artifacts_not_attempt_scoped": artifacts,
              "errors": failures,
              "limitations": (
                  "This independent snapshot preserves provider metadata, not crashed "
                  "runner memory, unavailable console logs, minidumps, or root cause. "
                  "The artifact list is run-wide, not attempt-scoped."
              ),
          }
          Path("ci-source-metadata.json").write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          if not source.get("id") or not jobs or failures:
              raise SystemExit("Incomplete source metadata; preserved partial snapshot")
          PY
      - name: Preserve independent metadata snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-source-metadata-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ci-source-metadata.json
          if-no-files-found: error
          retention-days: 14
