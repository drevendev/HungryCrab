name: Publish to PyPI

# A GitHub release is created only after the tag's CI run is green (CONTRIBUTING.md,
# "Releasing"), so publishing on the release event uploads only a tag that passed. PyPI trusts
# this workflow through Trusted Publishing (project hungry-crab, workflow publish.yml,
# environment pypi): no token is stored anywhere. A manual run republishes an existing tag,
# for example after a failed upload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v0.6.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # No cache in a publishing workflow: what is uploaded is built from the tag alone.
          enable-cache: false
          python-version: "3.13"
      - name: The tag names the packaged release version
        run: uv run --no-project python scripts/check_release_tag.py
      - run: uv build --no-sources
      - run: uv run --no-project python scripts/check_sdist.py
      - name: Check the metadata PyPI will render
        run: uvx --from "twine==7.0.0" twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/hungry-crab/
    # The OIDC token PyPI exchanges for a short-lived upload credential. Only this job, which
    # runs no repository code, can request it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
