name: Frozen 0.6.5 versus 0.6.6 comparison
on:
  push:
    branches: [codex/compare-065-066]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.11'
          enable-cache: false
      - name: Install only the two released tools outside all source caches
        run: |
          uv venv "$RUNNER_TEMP/arm-065"
          uv venv "$RUNNER_TEMP/arm-066"
          uv pip install --python "$RUNNER_TEMP/arm-065/bin/python" 'hungry-crab==0.6.5' 'PyYAML==6.0.3'
          uv pip install --python "$RUNNER_TEMP/arm-066/bin/python" 'hungry-crab==0.6.6' 'PyYAML==6.0.3'
      - name: Prepare fixed 2 GiB noexec acquisition filesystem
        id: volume
        run: python scripts/acquisition_volume.py prepare 2147483648
      - name: Acquire frozen public inputs once
        env:
          CRAB_VOLUME: ${{ steps.volume.outputs.volume }}
        run: '"$RUNNER_TEMP/arm-066/bin/python" -I experiments/release-065-066/acquire.py'
      - name: Paired AB BA runs with identical pins, policy and limits
        env:
          CRAB_VOLUME: ${{ steps.volume.outputs.volume }}
        run: |
          "$RUNNER_TEMP/arm-065/bin/python" -I experiments/release-065-066/arm.py 0.6.5 1
          "$RUNNER_TEMP/arm-066/bin/python" -I experiments/release-065-066/arm.py 0.6.6 1
          "$RUNNER_TEMP/arm-066/bin/python" -I experiments/release-065-066/arm.py 0.6.6 2
          "$RUNNER_TEMP/arm-065/bin/python" -I experiments/release-065-066/arm.py 0.6.5 2
      - name: Export only inert Git objects and public analysis evidence
        if: always() && steps.volume.outputs.root != ''
        env:
          CRAB_VOLUME: ${{ steps.volume.outputs.volume }}
        run: '"$RUNNER_TEMP/arm-066/bin/python" -I experiments/release-065-066/acquire.py export'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-comparison-065-066
          path: ${{ runner.temp }}/release-comparison-export/
          retention-days: 3
          if-no-files-found: error
      - name: Remove only the owned disposable filesystem
        if: always() && steps.volume.outputs.root != ''
        env:
          CRAB_QUOTA_ROOT: ${{ steps.volume.outputs.root }}
        run: python scripts/acquisition_volume.py cleanup "$CRAB_QUOTA_ROOT"
