name: Public MIT snapshot validation
on:
  push:
    branches: [codex/mit-pilot-public-acquisition]
permissions:
  contents: read
jobs:
  snapshot:
    name: MIT ${{ matrix.source.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [{"repo": "Textualize/rich", "sha": "9d8f9a372cc5916fd4781fec207ced7ddac2f08f", "license_path": "LICENSE", "license_blob": "4415505566f261c802b671426be529a31f914137"}, {"repo": "fastapi/typer", "sha": "a5882dedf0bc7a46cd861fdfca020f88519e0f21", "license_path": "LICENSE", "license_blob": "a7694736cf37716aafec14b24aa8d6316ebe07a3"}, {"repo": "python-jsonschema/jsonschema", "sha": "c497561ea0a95f5aac09cd63d15eb1420eb7bbec", "license_path": "COPYING", "license_blob": "af9cfbdb134f42e5205ecbad597421d778826481"}, {"repo": "lark-parser/lark", "sha": "9a4fb9c7458e8155636773a3cded0016d52516da", "license_path": "LICENSE", "license_blob": "aaf210b1d01da693fda15995ec973ed21cd968c3"}, {"repo": "ccusage/ccusage", "sha": "b40f51149d117e7c01b5f92466bae44e39c66a10", "license_path": "LICENSE", "license_blob": "4e042f531947d4d8d2c0e164f2d46df26129284e"}, {"repo": "cli/cli", "sha": "4f2cfe92e3499f8581bf39db77e0a1431fa7b55c", "license_path": "LICENSE", "license_blob": "b6a58a9572cbd7e4550f8205a9c4fd199cd442f2"}, {"repo": "kefranabg/readme-md-generator", "sha": "f0370c8efe602bfc1e1334ea556214de4c1b0f04", "license_path": "LICENSE", "license_blob": "338bd51e06c7bfa3e571b02d80d79f6dc8d52522"}]
    env:
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Install released CLI outside all source caches
        run: |
          uv venv "$RUNNER_TEMP/tool-env"
          uv pip install --python "$RUNNER_TEMP/tool-env/bin/python" "hungry-crab==0.6.4"
      - name: Prepare fixed-capacity noexec filesystem
        id: volume
        run: python scripts/acquisition_volume.py prepare 1073741824
      - name: Validate pinned public MIT snapshot as inert data
        env:
          CRAB_VOLUME: ${{ steps.volume.outputs.volume }}
          PUBLIC_DONOR: ${{ toJSON(matrix.source) }}
        run: '"$RUNNER_TEMP/tool-env/bin/python" -I scripts/public_mit_snapshot.py'
      - name: Upload public evidence and refusal details
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-mit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/public-mit-snapshot/
          retention-days: 3
          if-no-files-found: warn
      - name: Unmount disposable filesystem
        if: always() && steps.volume.outputs.root != ''
        env:
          CRAB_QUOTA_ROOT: ${{ steps.volume.outputs.root }}
        run: python scripts/acquisition_volume.py cleanup "$CRAB_QUOTA_ROOT"
