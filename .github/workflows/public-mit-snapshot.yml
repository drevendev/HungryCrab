name: Public MIT snapshot validation
on:
  push:
    branches: [codex/mit-pilot-public-acquisition]
permissions:
  contents: read
jobs:
  snapshot:
    name: MIT ${{ matrix.source.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [{"repo": "dbos-inc/dbos-transact-py", "sha": "4c28ea9ce6931523da3c3665674da0403d5784a7", "license_path": "LICENSE", "license_blob": "fbfc96becbfce6026378db95a29dc68a6bfb3979"}, {"repo": "temporalio/sdk-python", "sha": "df8caecda503be16cdf54b136fcd1d40811df2dd", "license_path": "LICENSE", "license_blob": "c7f1b9e7e809f4134614fdd5bd1b00c5e3a8df87"}, {"repo": "agronholm/anyio", "sha": "95a01430f37542f993cac2114244043f2eb1baca", "license_path": "LICENSE", "license_blob": "104eebf5a3002fccdaceef3a4cb936173c1c2035"}, {"repo": "Portkey-AI/gateway", "sha": "669825cbe89ee51569918b8f78a9db486fd69dd4", "license_path": "LICENSE", "license_blob": "2c0759f826129145c2b8d792ad1160a0b6342448"}, {"repo": "AgentOps-AI/agentops", "sha": "f8e907b92dabe47232978023fdcb01e2a7d4b752", "license_path": "LICENSE", "license_blob": "7a64b51e1c8de3d78db34a5cbbd00b609e085af4"}, {"repo": "agronholm/apscheduler", "sha": "bdaceb12792f104f25798dee2850d45f9e7d83f8", "license_path": "LICENSE.txt", "license_blob": "238c0d34b273c9d5c32971dc5131fa0b329ead1c"}, {"repo": "openai/openai-agents-python", "sha": "0dc4cf152bff1f50bdc0e41f28808563406545b2", "license_path": "LICENSE", "license_blob": "e5ad2c5aa30343f143a5c418004ca1a8d2cfaff4"}, {"repo": "Maciek-roboblog/Claude-Code-Usage-Monitor", "sha": "c59a83bf943f329f0e61f1a29c760353ee1860a5", "license_path": "LICENSE", "license_blob": "47e97b9875551b9439c0b3c54f67536c957aa5ed"}, {"repo": "python-jsonschema/referencing", "sha": "19ad61722eaec82086c37cd47ba4a801a5bd8c91", "license_path": "COPYING", "license_blob": "a9f853e43069b8e3f8a156a4af2b1198a004230d"}]
    env:
      PYTHONIOENCODING: utf-8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Install released CLI outside all source caches
        run: |
          uv venv "$RUNNER_TEMP/tool-env"
          uv pip install --python "$RUNNER_TEMP/tool-env/bin/python" "hungry-crab==0.6.4"
      - name: Prepare fixed-capacity noexec filesystem
        id: volume
        run: python scripts/acquisition_volume.py prepare 1073741824
      - name: Validate pinned public MIT snapshot as inert data
        env:
          CRAB_VOLUME: ${{ steps.volume.outputs.volume }}
          PUBLIC_DONOR: ${{ toJSON(matrix.source) }}
        run: '"$RUNNER_TEMP/tool-env/bin/python" -I scripts/public_mit_snapshot.py'
      - name: Upload public evidence and refusal details
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-mit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/public-mit-snapshot/
          retention-days: 3
          if-no-files-found: warn
      - name: Unmount disposable filesystem
        if: always() && steps.volume.outputs.root != ''
        env:
          CRAB_QUOTA_ROOT: ${{ steps.volume.outputs.root }}
        run: python scripts/acquisition_volume.py cleanup "$CRAB_QUOTA_ROOT"
