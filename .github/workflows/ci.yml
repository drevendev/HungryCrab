name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run moot; a push to master never does: every
# master commit keeps its own finished run, so "master is green" can be checked per commit.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONIOENCODING: utf-8

jobs:
  acquisition-quota:
    name: Hard acquisition quota (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-extras
      - name: Prepare the disposable 64 MiB filesystem
        id: volume
        run: uv run python scripts/acquisition_volume.py prepare 67108864
      - name: Exercise real HTTPS Git and kernel-enforced disk exhaustion
        env:
          CRAB_TEST_QUOTA_VOLUME: ${{ steps.volume.outputs.volume }}
        run: uv run pytest tests/test_acquisition_live.py tests/test_acquisition_transaction.py -q
      - name: Remove the disposable filesystem
        if: always() && steps.volume.outputs.root != ''
        env:
          CRAB_QUOTA_ROOT: ${{ steps.volume.outputs.root }}
        run: uv run python scripts/acquisition_volume.py cleanup "$CRAB_QUOTA_ROOT"
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_supply_chain.py
      - run: uv build
      - run: uv run python scripts/check_sdist.py

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows real-Git fixtures already take up to 18.5 minutes before review regressions.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - name: Menu benchmark (B1)
        run: uv run python benchmarks/menu_benchmark.py
      # Report only: with the default scoring the accepted generic priorities rank 31-35 of 56.
      # It becomes a gate when scoring earns it, not by tuning the defaults to its keys.
      - name: Ranking pressure benchmark (report only)
        continue-on-error: true
        run: uv run python benchmarks/ranking_benchmark.py
      - name: Digest this repository (smoke test)
        run: uv run crab digest . --maw . --out digest-out --maw-license MIT --fail-on-miner-error --fail-on-loss
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        with:
          name: self-digest
          path: digest-out

  minimal:
    name: Base installation without optional extras
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Without the extra, crab mcp --check refuses with exit code 2
        run: uv run python -c "import subprocess, sys; sys.exit(subprocess.run(['crab', 'mcp', '--check']).returncode != 2)"
      - run: uv run pytest tests/test_deep_channels.py tests/test_deep_manifests.py
      - run: uv run crab digest . --maw . --out digest-out --maw-license MIT --fail-on-miner-error --fail-on-loss

  install:
    name: Clean installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Install source/wheel, exercise stdio MCP and portable skills
        run: uv run python scripts/install_smoke.py --skills
