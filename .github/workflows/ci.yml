name: Open PR adversarial review
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
jobs:
  probes:
    name: Review PR ${{ matrix.pr }} (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
        pr: ["677", "687"]
        include:
          - pr: "677"
            subject: "31956b47fb9b280da83a72f4bc666552fe7b7851"
          - pr: "687"
            subject: "1785044d5cd787c693410420a7c04079964d4815"
    env:
      REVIEW_PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.subject }}
          path: subject
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
        working-directory: subject
      - name: Install the owned review probes
        working-directory: subject
        run: uv run python -c "import shutil; shutil.copyfile('../harness/review/probes.py', 'tests/test_open_pr_review.py')"
      - name: Exercise expected safety behavior on the pinned source
        working-directory: subject
        run: uv run pytest tests/test_open_pr_review.py -q -rA --junitxml=review-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: review-pr-${{ matrix.pr }}-${{ matrix.os }}-py${{ matrix.python }}
          path: subject/review-results.xml
