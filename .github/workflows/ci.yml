name: Open PR adversarial review
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pinned owned probe group
        type: choice
        options: [full677, historic, novelty, ind690]
        default: full677
        required: true
      subject:
        description: Exact PR 677 source commit for the full review
        default: d6ba132c81bbad940030fca8ae36702ca227e372
        required: true
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
jobs:
  independent690:
    if: inputs.mode == 'ind690'
    name: PR690 independent findings (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.subject }}
          path: subject
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
        working-directory: subject
      - name: Install the owned independent-review controls
        working-directory: subject
        run: uv run python -c "import shutil; shutil.copyfile('../harness/review/ind690_probes.py', 'tests/test_ind690_review.py')"
      - name: Exercise exact reviewed source without models or donor execution
        working-directory: subject
        run: uv run pytest tests/test_ind690_review.py -q -rA --junitxml=ind690-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ind690-${{ matrix.os }}-py${{ matrix.python }}
          path: subject/ind690-results.xml
  novelty:
    if: inputs.mode == 'novelty'
    name: T2 novelty preflight (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.subject }}
          path: subject
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
        working-directory: subject
      - run: uv run ruff check .
        if: matrix.os == 'ubuntu-latest'
        working-directory: subject
      - run: uv run ruff format --check --diff .
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        working-directory: subject
      - run: uv run mypy
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        working-directory: subject
      - name: Exercise owned immutable novelty and ordinary discovery controls
        if: success() || failure()
        working-directory: subject
        run: uv run pytest tests/test_novelty_exclusions.py tests/test_release_069_discovery.py::test_invoked_host_executes_replacements_and_an_original_probe -q --junitxml=t2-results.xml
      - name: Prepare hosted formatting corrections
        if: failure() && matrix.os == 'ubuntu-latest'
        working-directory: subject
        run: |
          uv run ruff check --fix . || true
          uv run ruff format .
          git diff --output=formatting.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() && matrix.os == 'ubuntu-latest'
        with:
          name: t2-formatting
          path: subject/formatting.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: t2-results-${{ matrix.os }}
          path: subject/t2-results.xml
  full677:
    if: inputs.mode == 'full677'
    name: Full PR 677 review (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.subject }}
          path: subject
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
        working-directory: subject
      - name: Install the owned full-review probes
        working-directory: subject
        run: uv run python -c "import shutil; shutil.copyfile('../harness/review/full677_probes.py', 'tests/test_full677_review.py')"
      - name: Exercise the pinned candidate without model/provider calls
        working-directory: subject
        run: uv run pytest tests/test_full677_review.py -q -rA --junitxml=full677-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: full677-${{ matrix.os }}-py${{ matrix.python }}
          path: subject/full677-results.xml
  probes:
    if: inputs.mode == 'historic'
    name: Review PR ${{ matrix.pr }} (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
        pr: ["677", "687"]
        include:
          - pr: "677"
            subject: "958112fa55725170d6c576b993d619f2e9dc8c32"
          - pr: "687"
            subject: "b8439609b60e2b9a20f6abadba7f63b7a907951d"
    env:
      REVIEW_PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.subject }}
          path: subject
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
        working-directory: subject
      - name: Install the owned review probes
        working-directory: subject
        run: uv run python -c "import shutil; shutil.copyfile('../harness/review/probes.py', 'tests/test_open_pr_review.py')"
      - name: Exercise expected safety behavior on the pinned source
        working-directory: subject
        run: uv run pytest tests/test_open_pr_review.py -q -rA --junitxml=review-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: review-pr-${{ matrix.pr }}-${{ matrix.os }}-py${{ matrix.python }}
          path: subject/review-results.xml
  compatibility:
    if: inputs.mode == 'historic'
    name: Verify combined CI without merging a branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python review/check_ci_merge.py 958112fa55725170d6c576b993d619f2e9dc8c32 b8439609b60e2b9a20f6abadba7f63b7a907951d
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: merged-ci-proof
          path: merged-ci.yml
