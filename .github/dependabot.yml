version: 2
updates:
  - package-ecosystem: npm
    directory: /scripts/skills-installer
    schedule:
      interval: weekly
    groups:
      skills-installer:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
