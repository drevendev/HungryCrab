[project]
name = "pycli"
version = "0.2.0"
description = "A tiny command-line tool for counting tide pools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Dana Reef" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = ["click>=8.1"]

[project.scripts]
pycli = "pycli.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pycli --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["pycli"]
