# B1 - the menu benchmark. Frozen inputs, human verdicts, one number per pull request.
#
# The golden set is not invented: every entry below is a decision the maintainer actually
# made in `.crab/ledger.json` while eating these three repositories. `must` was served,
# `must_not` was rejected with the reason kept verbatim. Regenerating this file from a later
# ledger would defeat the point - it is frozen on purpose, like the digests next to it.
schema: hungry-crab.menu-benchmark/1
maw:
  label: drevendev/HungryCrab
  sha: 6a01eb94bf0e09beb0d4bbb2113a0a0cd09b9f49
  tag: v0.2.0
  license: MIT
  digest: maw
# The floor and the ceiling that gate a pull request, set to what master measured when the
# benchmark was introduced: recall 10/10, noise 19/29. Raise the floor and lower the ceiling
# when a rule improves; never move either one to make a change pass.
thresholds:
  recall_must_at_30: 1.0
  noise_at_30: 0.66
pairs:
  - prey: pypa/pipx
    sha: c490b45bc4d18f8968d527ec2d37b8af36eb4361
    digest: prey/pypa-pipx
    must:
      - ci.release-automation
      - ci.schedule
      - history-lesson.pypa-pipx.fix-prone
      - hygiene.issue-templates
      - hygiene.pr-template
      - tests.coverage
    must_not:
      - key: architecture.pypa-pipx.raw
        reason: "pipx's layering does not inform a repo-mining CLI"
      - key: ci.macos-runner
        reason: "Windows and Linux are the claimed platforms; macOS is not supported"
      - key: ci.reusable-workflows
        reason: "one workflow here; factoring it out is premature"
      - key: deps.python.others
        reason: "a bag of 37 packages is not a nutrient"
      - key: deps.python.pre-commit
        reason: "pre-commit is already configured here; only the dev-dependency pin is missing"
      - key: deps.python.pytest-cov
        reason: "duplicate of tests.coverage: the deps rule proposes the library that implements a nutrient already on the menu"
      - key: docs.site
        reason: "pre-1.0; docs/design in the repo is enough for now"
      - key: issue-lesson.pypa-pipx.cluster-1
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.cluster-2
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.cluster-3
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.cluster-4
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.cluster-5
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.cluster-6
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.cluster-7
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.cluster-8
        reason: "term-list cluster about pipx's own users, not actionable for this maw"
      - key: issue-lesson.pypa-pipx.top-1370
        reason: "a feature request for pipx, unrelated to this maw"
      - key: issue-lesson.pypa-pipx.top-149
        reason: "a feature request for pipx, unrelated to this maw"
      - key: issue-lesson.pypa-pipx.top-278
        reason: "a feature request for pipx, unrelated to this maw"
      - key: issue-lesson.pypa-pipx.top-376
        reason: "a feature request for pipx, unrelated to this maw"
      - key: issue-lesson.pypa-pipx.top-754
        reason: "a feature request for pipx, unrelated to this maw"
      - key: tooling.type_checker.ty
        reason: "maw already runs mypy --strict; ty is an alternative, not an addition"
  - prey: anthropics/skills
    sha: 41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f
    digest: prey/anthropics-skills
    must:
      - ai-config.skills-corpus
      - hygiene.notice-file
    must_not:
      - key: architecture.anthropics-skills.raw
        reason: "the hubs are docx and pptx helper scripts; that layering says nothing about a repo-mining CLI"
      - key: issue-lesson.anthropics-skills.cluster-1
        reason: "image and attachment problems in the Claude skills UI; nothing a repo-mining CLI can act on"
      - key: issue-lesson.anthropics-skills.cluster-2
        reason: "bugs in the prey's own run_eval.py; the eval idea is worth reading for the benchmark, the issues are not a nutrient"
      - key: issue-lesson.anthropics-skills.cluster-3
        reason: "cluster of six issues around the terms skills and claude: no theme, no lesson"
  - prey: github-linguist/linguist
    sha: 5fb5096b95ab9893c5925d87121e5faaae9f3966
    digest: prey/github-linguist-linguist
    must:
      - hygiene.codeowners
      - hygiene.readme-sections
    must_not:
      - key: history-lesson.github-linguist-linguist.fix-prone
        reason: "the fix-prone files are language grammars and docs, not structure a repo-mining CLI can learn from"
      - key: issue-lesson.github-linguist-linguist.cluster-1
        reason: "linguist's issues are requests to add languages and grammars: its domain, not a lesson for any maw. Three meals have produced 22 issue lessons and kept none, so the category is switched off in .crab.yml"
      - key: tooling.devcontainer
        reason: "uv already pins the toolchain on Windows and Linux; a devcontainer is a Linux-only second environment to keep in sync"
      - key: tooling.dockerfile
        reason: "the crab is consumed as a uv tool and a plugin; a Dockerfile is not how anyone runs it"
