name: Hungry Crab Feeder
description: Digest a prey and upload a deterministic menu without a model or repository writes
author: Dreven
branding:
  icon: search
  color: orange
inputs:
  prey:
    description: GitHub owner/repo or a local repository path
    required: true
  maw:
    description: Checked-out maw directory, relative to the workspace or absolute
    default: '.'
  token:
    description: Read-only REST token (the job token by default); no gh authentication needed
    default: ${{ github.token }}
  shallow:
    description: Fetch only the default branch
    default: 'true'
  since:
    description: History window (90d, 2y, ISO date, or all)
    default: 90d
  issues:
    description: Number of recent issues to read (0 disables acquisition)
    default: '100'
  wiki:
    description: Read independent prey and maw wiki repositories when available
    default: 'true'
  depth:
    description: Miner depth (normal or deep)
    default: normal
  top:
    description: Number of candidates in the Markdown menu
    default: '30'
  max-repo-kb:
    description: GitHub repository size preflight; not a hard disk quota
    default: '307200'
  acquisition-volume:
    description: Fixed-capacity filesystem for acquisition; blank provisions an ephemeral Linux loop volume
    default: ''
  max-download-bytes:
    description: Shared main/wiki encrypted Git response byte allowance
    default: '314572800'
  max-acquisition-disk-bytes:
    description: Maximum acquisition filesystem capacity, including cache, staging and temporary files
    default: '1073741824'
  allow-loss:
    description: Explicitly accept inventory visibility loss
    default: 'false'
  out:
    description: New or empty output directory (default is a unique runner temporary directory)
    default: ''
  cache-dir:
    description: Cache directory (default is in runner temporary storage; never uploaded)
    default: ''
  artifact-name:
    description: Artifact name; use a distinct name for each matrix job
    default: crab-meal
  retention-days:
    description: Meal artifact retention in days
    default: '14'
  allow-private-artifact:
    description: >-
      Upload the meal although the calling repository is public and the prey or the maw is not
      verifiably public; both digests then become downloadable by anyone signed in to GitHub
    default: 'false'
outputs:
  bundle-path:
    description: Local meal bundle directory
    value: ${{ steps.feed.outputs.bundle-path }}
  menu-path:
    description: Local menu.json path
    value: ${{ steps.feed.outputs.menu-path }}
  candidate-count:
    description: Total candidates
    value: ${{ steps.feed.outputs.candidate-count }}
  artifact-id:
    description: Uploaded artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Download URL
    value: ${{ steps.upload.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: '3.11'
        enable-cache: false
    - name: Prepare a fixed-capacity acquisition volume
      id: acquisition
      if: inputs.acquisition-volume == '' && runner.os == 'Linux'
      shell: pwsh
      env:
        CRAB_ACTION_PATH: ${{ github.action_path }}
        CRAB_DISK_BYTES: ${{ inputs.max-acquisition-disk-bytes }}
      run: |
        uv run --directory "$env:CRAB_ACTION_PATH" --locked --no-dev python "$env:CRAB_ACTION_PATH/scripts/acquisition_volume.py" prepare "$env:CRAB_DISK_BYTES"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run the deterministic pipeline
      id: feed
      shell: pwsh
      env:
        CRAB_ACTION_PATH: ${{ github.action_path }}
        CRAB_PREY: ${{ inputs.prey }}
        CRAB_MAW: ${{ inputs.maw }}
        GH_TOKEN: ${{ inputs.token }}
        CRAB_SHALLOW: ${{ inputs.shallow }}
        CRAB_SINCE: ${{ inputs.since }}
        CRAB_ISSUES: ${{ inputs.issues }}
        CRAB_WIKI: ${{ inputs.wiki }}
        CRAB_DEPTH: ${{ inputs.depth }}
        CRAB_TOP: ${{ inputs.top }}
        CRAB_MAX_REPO_KB: ${{ inputs.max-repo-kb }}
        CRAB_ACQUISITION_VOLUME: ${{ inputs.acquisition-volume || steps.acquisition.outputs.volume }}
        CRAB_MAX_DOWNLOAD_BYTES: ${{ inputs.max-download-bytes }}
        CRAB_MAX_ACQUISITION_DISK_BYTES: ${{ inputs.max-acquisition-disk-bytes }}
        CRAB_ALLOW_LOSS: ${{ inputs.allow-loss }}
        CRAB_OUT: ${{ inputs.out }}
        CRAB_CACHE: ${{ inputs.cache-dir }}
        CRAB_ALLOW_PRIVATE_ARTIFACT: ${{ inputs.allow-private-artifact }}
        PYTHONIOENCODING: utf-8
      run: |
        uv run --directory "$env:CRAB_ACTION_PATH" --locked --no-dev python "$env:CRAB_ACTION_PATH/scripts/feeder_action.py"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: upload
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.feed.outputs.bundle-path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
    - name: Remove the ephemeral acquisition volume
      if: always() && steps.acquisition.outputs.root != ''
      shell: pwsh
      env:
        CRAB_ACTION_PATH: ${{ github.action_path }}
        CRAB_ACQUISITION_ROOT: ${{ steps.acquisition.outputs.root }}
      run: |
        uv run --directory "$env:CRAB_ACTION_PATH" --locked --no-dev python "$env:CRAB_ACTION_PATH/scripts/acquisition_volume.py" cleanup "$env:CRAB_ACQUISITION_ROOT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
